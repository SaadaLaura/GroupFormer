tags:
  - Project
summary: "Renvoie un projet en fonction de son id"
produces:
  - "application/json"
parameters:
  - name: project_id
    in: path
    type: integer
    required: true
definitions:
  Project:
    type: object
    properties:
      id_project:
        type: integer
      name:
        type: string
      description:
        type: string
      deadline:
        type: datetime
      size:
        type: integer
responses:
  200:
    description: "OK"
    schema:
      type: object
      $ref: "#/definitions/Project"
  404:
    description: "Not Found"
  500:
    description: "Internal Server Error"
