tags:
  - Project
summary: "Liste toutes les annonces d'un projet en fonction de son id"
produces:
  - "application/json"
parameters:
  - name: project_id
    in: path
    type: integer
    required: true
definitions:
  Announcement:
    type: object
    properties:
      id_announcement:
        type: integer
      description:
        type: string
      publication:
        type: datetime
      id_project:
        type: integer
responses:
  200:
    description: "OK"
    schema:
      type: array
      items:
        $ref: '#/definitions/Announcement'
  404:
    description: "Not Found"
  500:
    description: "Internal Server Error"
