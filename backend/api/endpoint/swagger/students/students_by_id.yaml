tags:
  - Student
summary: "Renvoie un étudiant en fonction de son id"
produces:
  - "application/json"
parameters:
  - name: student_id
    in: path
    type: integer
    required: true
definitions:
  User:
    type: object
    properties:
      id_user:
        type: integer
      firstname:
        type: string
      lastname:
        type: string
      email:
        type: string
      password:
        type: string
responses:
  200:
    description: "OK"
    schema:
      type: object
      $ref: "#/definitions/User"
  404:
    description: "Not Found"
  #    schema:
  #      type: "object"
  #      properties:
  #        error:
  #          type: "string"
  #          example: "No students found"
  500:
    description: "Internal Server Error"
