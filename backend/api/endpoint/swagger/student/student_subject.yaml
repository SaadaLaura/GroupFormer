tags:
  - Student
summary: "Renvoie les sujets suivi d'un étudiant en fonction de son id"
produces:
  - "application/json"
parameters:
  - name: student_id
    in: path
    type: integer
    required: true
responses:
  200:
    description: "OK"
    schema:
      type: array
      items:
        type: string
  404:
    description: "Not Found"
  500:
    description: "Internal Server Error"
