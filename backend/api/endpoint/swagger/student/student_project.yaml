tags:
  - Student
summary: "Renvoie le groupe (projet) d'un étudiant en fonction de son id"
produces:
  - "application/json"
parameters:
  - name: student_id
    in: path
    type: integer
    required: true
definitions:
  Project:
    type: object
    properties:
      id_project:
        type: integer
      name:
        type: string
      description:
        type: string
      deadline:
        type: datetime
      size:
        type: integer
responses:
  200:
    description: "OK"
    schema:
      type: object
      $ref: "#/definitions/Project"
  404:
    description: "Not Found"
  #    schema:
  #      type: "object"
  #      properties:
  #        error:
  #          type: "string"
  #          example: "No student found"
  500:
    description: "Internal Server Error"
