summary: "Get Announcements"
description: "Cet app renvoie une liste de tous les annonces disponibles."
produces:
  - "application/json"
responses:
  200:
    description: "Succès"
    schema:
      type: "array"
      items:
        type: "object"
        properties:
          id_annoucement:
            type: "integer"
            example: 1234
            description: "L'ID unique de l'annonce."
          project_name:
            type: "string"
            example: "GroupFormer"
            description: "Le nom du projet."
          description:
            type: "string"
            example: "description de l'annonce"
            description: "La description de l'annonce."
          publication:
            type: "date"
            example: "01/01/2025"
            description: "La date de publication de l'annonce."
          id_project:
            type: "integer"
            example: "123"
            description: "L'ID unique du projet lié à l'annonce."
  404:
    description: "Aucune annonce trouvée."
    schema:
      type: "object"
      properties:
        error:
          type: "string"
          example: "No announcements found"
  500:
    description: "Erreur interne du serveur."
    schema:
      type: "object"
      properties:
        error:
          type: "string"
          example: "Une erreur est survenue lors de la récupération des données."
