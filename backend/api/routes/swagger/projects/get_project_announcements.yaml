tags:
  - Project
summary: Get project announcements
description: Retrieve all announcements associated with a specific project.
security:
  - BearerAuth: []
parameters:
  - in: path
    name: id_project
    required: true
    type: integer
    description: ID of the project to retrieve announcements for
    example: 101
responses:
  200:
    description: List of announcements for the project
    schema:
      type: array
      items:
        $ref: '#/definitions/AnnouncementDTO'
  404:
    description: Project not found
  401:
    description: Unauthorized (missing or invalid token)
