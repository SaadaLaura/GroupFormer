tags:
  - User
summary: Change user password
description: Allows an authenticated user to update their password.
security:
  - BearerAuth: []
parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      properties:
        old_password:
          type: string
          example: "old_password"
        new_password:
          type: string
          example: "new_password"
        confirm_password:
          type: string
          example: "new_password"
responses:
  200:
    description: Password updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Password updated successfully"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR..."
  400:
    description: Invalid old password or passwords do not match
