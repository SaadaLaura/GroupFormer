tags:
  - User
summary: Upload students from a file
description: Allows an admin to bulk upload students from an Excel file.
security:
  - BearerAuth: []
parameters:
  - name: file
    in: formData
    required: true
    type: file
    description: Excel file containing student data [firstname, lastname, email, password].
responses:
  201:
    description: Students added successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: "Students added successfully"
        count:
          type: integer
          example: 50
  400:
    description: Invalid file format or missing required columns
  500:
    description: Server error
