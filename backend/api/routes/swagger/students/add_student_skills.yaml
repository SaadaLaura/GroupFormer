tags:
  - Student
summary: "🔏 Required role: STUDENT | Add skills to the logged-in student"
description: Allows a student to add skills to their profile.
security:
  - BearerAuth: []
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            type: integer
            example: 1
          name:
            type: string
            example: "Python"
responses:
  201:
    description: Skills added successfully
  400:
    description: Invalid input format
  404:
    description: Skill not found
  401:
    description: Unauthorized (missing or invalid token)
