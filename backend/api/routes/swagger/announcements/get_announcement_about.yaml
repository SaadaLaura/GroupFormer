tags:
  - Announcement
summary: Get subjects included in an announcement
description: Retrieve all subjects associated with a specific announcement.
security:
  - BearerAuth: []
parameters:
  - in: path
    name: id_announcement
    required: true
    type: integer
    description: ID of the announcement
    example: 1213
responses:
  200:
    description: List of subjects for the announcement
    schema:
      type: array
      items:
        $ref: '#/definitions/Subject'
  401:
    description: Unauthorized (missing or invalid token)
