<div class="navbar">
  <img src="assets/img/logo_groupFormer.png" alt="GroupFormer Logo" class="logo">
  <a (click)="navigateTo('home')" class="project-name">GroupFormer</a>
</div>

<div class="login-container">
  <h1>Connexion à votre compte</h1>
  <p>Saisissez votre e-mail universitaire</p>
  <div *ngIf="emailNotFoundError" class="info-message">Cet e-mail est introuvable, veuillez contacter l'administration de votre école</div>
  <input type="email" placeholder="Exemple@ecole.com" class="input-box" [(ngModel)]="email" [ngClass]="{'error': emailError || loginError}" (keydown.enter)="nextStep()">
  <div *ngIf="emailError" class="error-message">Veuillez saisir votre email universitaire</div>

  <div *ngIf="showPasswordInput" class="password-container">
    <div class="password-input-container">
      <input type="password" placeholder="Mot de passe" class="input-box" id="password" [(ngModel)]="password" [ngClass]="{'error': passwordError || loginError}" (keydown.enter)="login()">
      <button type="button" class="show-password-btn" (click)="togglePasswordVisibility()">Afficher</button>
    </div>
    <div *ngIf="passwordError" class="error-message">Veuillez saisir votre mot de passe</div>
    <div *ngIf="loginError" class="error-message">Mot de passe erroné, veuillez réessayer</div>
  </div>

  <button *ngIf="!showPasswordInput" (click)="nextStep()" class="login-btn">Suivant</button>
  <button *ngIf="showPasswordInput" (click)="login()" class="login-btn">Connexion</button>
</div>
