<h1 class="main-title">Bienvenue chez GroupFormer</h1>
<div class="register-container">
  <p>Ne perdez plus de temps à chercher un groupe ou un projet</p>
  <label for="email">Email universitaire</label>
  <input type="email" id="email" placeholder="Exemple@ecole.com" class="input-box" [(ngModel)]="email" [ngClass]="{'error': emailError}">
  <div *ngIf="emailError" class="error-message">Veuillez rentrer l'email</div>
  <label for="password">Mot de passe (minimum 6 caractères)</label>
  <input type="password" id="password" placeholder="Mot de passe" class="input-box" [(ngModel)]="password" [ngClass]="{'error': passwordError}">
  <div *ngIf="passwordError" class="error-message">Il faut un mot de passe de 6 caractères minimum</div>
  <label for="fullName">Nom complet</label>
  <input type="text" id="fullName" placeholder="Nom complet" class="input-box" [(ngModel)]="fullName" [ngClass]="{'error': fullNameError}">
  <div *ngIf="fullNameError" class="error-message">Veuillez rentrer le nom complet</div>
  <button (click)="register()" class="register-btn">S'inscrire</button>
</div>
